[package]
name    = "wez-nardo-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
crossterm = { version = "0.29.0", default-features = false, features = ["windows"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[[bin]]
name = "wez-nardo"
path = "src/main.rs"

[profile.release]
opt-level     = "z"
lto           = "fat"
codegen-units = 1
strip         = true
